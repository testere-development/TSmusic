[project]
name = "tsmusic"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Flet developer", email = "you@example.com" }
]
dependencies = [
    "flet>=1.1.2",
    "yt-dlp",
    "pyjnius"
]

[dependency-groups]
dev = [
    "flet-cli>=1.1.2",
    "flet-desktop>=1.1.2",
    "flet-web>=1.1.2",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=1.1.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.flet]
desktop_flavor = "light"    # Change to "full" to use flet-audio and flet-video
org = "com.mycompany"
product = "tsmusic"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"

# src/assets/icon.png is the icon for every platform. Keep it transparent and
# filling the whole canvas: web, Windows and Linux show it as-is, and Flet
# shrinks it to the margin iOS, macOS and Android each mask away. This colour
# is what sits behind it where transparency cannot survive - the iOS icon, the
# macOS tile and the Android background layer. Defaults to white.
# icon_background = "#ffffff"

[tool.flet.app]
path = "src"

[tool.flet.android]
# Tək APK, içində hər iki ABI olsun (split yoxdur)
split_per_abi = false
target_arch = ["arm64-v8a", "armeabi-v7a"]
# targetSdk 28 -> Android 10+ cihazlarda da data qovluğundan binary (ffmpeg) icra oluna bilir
min_sdk_version = 24
target_sdk_version = 28
# binary-lər APK-dan çıxarılsın (nativeLibraryDir-də fiziki fayl kimi)
legacy_packaging = true
